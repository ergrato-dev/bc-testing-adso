# Corre los tests de la app de referencia y exige el umbral de cobertura (80%)
# en cada push y pull request. Es el modelo del CI que montas en la semana 2.
name: referencia

on:
  push:
    branches: [main]
    paths: ["referencia/**", ".github/workflows/referencia.yml"]
  pull_request:
    paths: ["referencia/**", ".github/workflows/referencia.yml"]

jobs:
  node:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-react, api-express]
    defaults:
      run:
        working-directory: referencia/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: referencia/${{ matrix.app }}/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install
      - run: pnpm test

  api-fastapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: referencia/api-fastapi
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run pytest

  api-springboot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: referencia/api-springboot
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: ./mvnw -B verify
