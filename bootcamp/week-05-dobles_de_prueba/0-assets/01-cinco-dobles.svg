<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="900" height="420" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Cinco dobles, de menos a más comportamiento</text>

  <!-- Eje -->
  <line x1="60" y1="345" x2="840" y2="345" stroke="#475569" stroke-width="2"/>
  <polygon points="840,339 852,345 840,351" fill="#475569"/>
  <text x="60" y="370" fill="#94a3b8" font-size="12">no hace nada</text>
  <text x="840" y="370" text-anchor="end" fill="#94a3b8" font-size="12">se comporta casi como el real</text>

  <!-- Dummy -->
  <rect x="50" y="90" width="150" height="230" rx="8" fill="#1e293b"/>
  <text x="125" y="120" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="700">Dummy</text>
  <text x="125" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">Solo ocupa</text>
  <text x="125" y="166" text-anchor="middle" fill="#94a3b8" font-size="12">un parámetro</text>
  <text x="125" y="290" text-anchor="middle" fill="#a5b4fc" font-size="12">notifier=None</text>

  <!-- Stub -->
  <rect x="215" y="90" width="150" height="230" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="290" y="120" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="700">Stub</text>
  <text x="290" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">Devuelve respuestas</text>
  <text x="290" y="166" text-anchor="middle" fill="#94a3b8" font-size="12">preparadas</text>
  <text x="290" y="210" text-anchor="middle" fill="#f1f5f9" font-size="13">controla lo que</text>
  <text x="290" y="228" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">ENTRA</text>
  <text x="290" y="290" text-anchor="middle" fill="#a5b4fc" font-size="11">mockResolvedValue([])</text>

  <!-- Spy -->
  <rect x="380" y="90" width="150" height="230" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="455" y="120" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="700">Spy</text>
  <text x="455" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">Registra cómo</text>
  <text x="455" y="166" text-anchor="middle" fill="#94a3b8" font-size="12">lo llamaron</text>
  <text x="455" y="210" text-anchor="middle" fill="#f1f5f9" font-size="13">verifica lo que</text>
  <text x="455" y="228" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">SALE</text>
  <text x="455" y="290" text-anchor="middle" fill="#a5b4fc" font-size="11">toHaveBeenCalledWith</text>

  <!-- Mock -->
  <rect x="545" y="90" width="150" height="230" rx="8" fill="#1e293b" stroke="#F89820" stroke-width="2"/>
  <text x="620" y="120" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="700">Mock</text>
  <text x="620" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">Stub + spy</text>
  <text x="620" y="166" text-anchor="middle" fill="#94a3b8" font-size="12">con expectativas</text>
  <text x="620" y="210" text-anchor="middle" fill="#f1f5f9" font-size="13">controla y</text>
  <text x="620" y="228" text-anchor="middle" fill="#f1f5f9" font-size="13">verifica</text>
  <text x="620" y="290" text-anchor="middle" fill="#a5b4fc" font-size="11">when(...) + verify(...)</text>

  <!-- Fake -->
  <rect x="710" y="90" width="150" height="230" rx="8" fill="#1e293b" stroke="#2EAD33" stroke-width="2"/>
  <text x="785" y="120" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="700">Fake</text>
  <text x="785" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">Implementación real</text>
  <text x="785" y="166" text-anchor="middle" fill="#94a3b8" font-size="12">pero simplificada</text>
  <text x="785" y="210" text-anchor="middle" fill="#f1f5f9" font-size="13">tiene estado</text>
  <text x="785" y="228" text-anchor="middle" fill="#f1f5f9" font-size="13">propio</text>
  <text x="785" y="290" text-anchor="middle" fill="#a5b4fc" font-size="11">MemoryRepository</text>

  <text x="450" y="405" text-anchor="middle" fill="#94a3b8" font-size="12">vi.fn(), mocker.Mock() y @Mock pueden ser stub, spy o mock: lo define cómo los usas en el test.</text>
</svg>
