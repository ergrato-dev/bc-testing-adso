<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Un push, cuatro jobs en paralelo, cada uno en su máquina</text>

  <!-- Disparador -->
  <rect x="40" y="190" width="120" height="56" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="100" y="214" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="700">push / PR</text>
  <text x="100" y="233" text-anchor="middle" fill="#94a3b8" font-size="11">GitHub Actions</text>

  <line x1="162" y1="212" x2="206" y2="86" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="162" y1="215" x2="206" y2="176" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="162" y1="221" x2="206" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="162" y1="226" x2="206" y2="356" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Frontend -->
  <rect x="210" y="60" width="650" height="56" rx="8" fill="#1e293b" stroke="#61DAFB" stroke-width="1.5"/>
  <text x="230" y="84" fill="#61DAFB" font-size="14" font-weight="700">Frontend</text>
  <text x="230" y="103" fill="#94a3b8" font-size="12">pnpm test · umbral 80%</text>
  <rect x="600" y="72" width="240" height="32" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="720" y="93" text-anchor="middle" fill="#cbd5e1" font-size="12">artefacto: cobertura</text>

  <!-- Backend -->
  <rect x="210" y="150" width="650" height="56" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="230" y="174" fill="#c4b5fd" font-size="14" font-weight="700">Backend</text>
  <text x="230" y="193" fill="#94a3b8" font-size="12">unitarias + API · umbral 80%</text>
  <rect x="600" y="162" width="240" height="32" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="720" y="183" text-anchor="middle" fill="#fde68a" font-size="12">sin BD: integración "skipped"</text>

  <!-- Integración -->
  <rect x="210" y="240" width="650" height="56" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="230" y="264" fill="#93c5fd" font-size="14" font-weight="700">Integración</text>
  <text x="230" y="283" fill="#94a3b8" font-size="12">mismos tests + DATABASE_URL</text>
  <rect x="600" y="252" width="240" height="32" rx="6" fill="#0f172a" stroke="#3b82f6"/>
  <text x="720" y="273" text-anchor="middle" fill="#93c5fd" font-size="12">servicio: PostgreSQL o MySQL</text>

  <!-- E2E -->
  <rect x="210" y="330" width="650" height="56" rx="8" fill="#1e293b" stroke="#2EAD33" stroke-width="1.5"/>
  <text x="230" y="354" fill="#86efac" font-size="14" font-weight="700">E2E</text>
  <text x="230" y="373" fill="#94a3b8" font-size="12">backend en 2.º plano · curl espera · Playwright</text>
  <rect x="600" y="342" width="240" height="32" rx="6" fill="#0f172a" stroke="#2EAD33"/>
  <text x="720" y="363" text-anchor="middle" fill="#86efac" font-size="12">servicio BD · artefacto: reporte</text>

  <text x="450" y="420" text-anchor="middle" fill="#cbd5e1" font-size="13">Los cuatro deben ser checks obligatorios del ruleset de main.</text>
</svg>
