<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Dos formas de empezar cada test con la BD limpia</text>

  <!-- Rollback -->
  <text x="40" y="84" fill="#93c5fd" font-size="15" font-weight="700">Transacción con rollback</text>
  <text x="40" y="104" fill="#94a3b8" font-size="12">FastAPI y Spring Boot en la referencia</text>
  <rect x="40" y="120" width="170" height="56" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="125" y="153" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">BEGIN</text>
  <rect x="250" y="120" width="170" height="56" rx="8" fill="#1e293b"/>
  <text x="335" y="145" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Semilla</text>
  <text x="335" y="163" text-anchor="middle" fill="#94a3b8" font-size="11">Arrange</text>
  <rect x="460" y="120" width="170" height="56" rx="8" fill="#1e293b"/>
  <text x="545" y="145" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Test</text>
  <text x="545" y="163" text-anchor="middle" fill="#94a3b8" font-size="11">Act + Assert</text>
  <rect x="670" y="120" width="190" height="56" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="765" y="145" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">ROLLBACK</text>
  <text x="765" y="163" text-anchor="middle" fill="#94a3b8" font-size="11">nada queda guardado</text>
  <line x1="212" y1="148" x2="246" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="422" y1="148" x2="456" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="632" y1="148" x2="666" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="40" y="206" fill="#86efac" font-size="12">✓ muy rápida</text>
  <text x="200" y="206" fill="#fca5a5" font-size="12">✗ el test y la app deben compartir la conexión (no sirve para E2E)</text>

  <line x1="40" y1="232" x2="860" y2="232" stroke="#334155" stroke-width="1"/>

  <!-- Truncado -->
  <text x="40" y="268" fill="#fde68a" font-size="15" font-weight="700">Truncado antes de cada test</text>
  <text x="40" y="288" fill="#94a3b8" font-size="12">Express en la referencia</text>
  <rect x="40" y="304" width="170" height="56" rx="8" fill="#1e293b" stroke="#F7DF1E" stroke-width="2"/>
  <text x="125" y="329" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="700">TRUNCATE</text>
  <text x="125" y="347" text-anchor="middle" fill="#94a3b8" font-size="11">beforeEach</text>
  <rect x="250" y="304" width="170" height="56" rx="8" fill="#1e293b"/>
  <text x="335" y="329" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Semilla</text>
  <text x="335" y="347" text-anchor="middle" fill="#94a3b8" font-size="11">Arrange</text>
  <rect x="460" y="304" width="170" height="56" rx="8" fill="#1e293b"/>
  <text x="545" y="329" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Test</text>
  <text x="545" y="347" text-anchor="middle" fill="#94a3b8" font-size="11">Act + Assert</text>
  <rect x="670" y="304" width="190" height="56" rx="8" fill="#1e293b"/>
  <text x="765" y="329" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Datos quedan</text>
  <text x="765" y="347" text-anchor="middle" fill="#94a3b8" font-size="11">hasta el siguiente TRUNCATE</text>
  <line x1="212" y1="332" x2="246" y2="332" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="422" y1="332" x2="456" y2="332" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="632" y1="332" x2="666" y2="332" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="40" y="390" fill="#86efac" font-size="12">✓ funciona con cualquier conexión</text>
  <text x="290" y="390" fill="#fca5a5" font-size="12">✗ más lenta con muchas tablas</text>
  <text x="510" y="390" fill="#86efac" font-size="12">✓ puedes revisar qué dejó el test que falló</text>
</svg>
