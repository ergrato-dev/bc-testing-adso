<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Los cuatro estados de un componente que carga datos</text>

  <!-- Cargando -->
  <rect x="60" y="160" width="200" height="90" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="192" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Cargando</text>
  <text x="160" y="216" text-anchor="middle" fill="#94a3b8" font-size="12">"Cargando piezas…"</text>
  <text x="160" y="236" text-anchor="middle" fill="#a5b4fc" font-size="11">getByText al montar</text>

  <!-- Datos -->
  <rect x="440" y="60" width="240" height="90" rx="8" fill="#14532d"/>
  <text x="560" y="92" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Con datos</text>
  <text x="560" y="116" text-anchor="middle" fill="#bbf7d0" font-size="12">lista con un ítem por pieza</text>
  <text x="560" y="136" text-anchor="middle" fill="#bbf7d0" font-size="11">findByRole('list') + within</text>

  <!-- Vacío -->
  <rect x="440" y="170" width="240" height="90" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="560" y="202" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Vacío</text>
  <text x="560" y="226" text-anchor="middle" fill="#94a3b8" font-size="12">"Aún no hay piezas registradas."</text>
  <text x="560" y="246" text-anchor="middle" fill="#94a3b8" font-size="11">findByText + queryByRole('list')</text>

  <!-- Error -->
  <rect x="440" y="280" width="240" height="90" rx="8" fill="#7f1d1d"/>
  <text x="560" y="312" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Error</text>
  <text x="560" y="336" text-anchor="middle" fill="#fecaca" font-size="12">role="alert" con el mensaje</text>
  <text x="560" y="356" text-anchor="middle" fill="#fecaca" font-size="11">findByRole('alert')</text>

  <line x1="262" y1="190" x2="436" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="262" y1="205" x2="436" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="262" y1="220" x2="436" y2="320" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <text x="300" y="130" fill="#94a3b8" font-size="11" transform="rotate(-24 300 130)">responde [ … ]</text>
  <text x="320" y="200" fill="#94a3b8" font-size="11">responde [ ]</text>
  <text x="300" y="262" fill="#94a3b8" font-size="11" transform="rotate(29 300 262)">falla la petición</text>

  <text x="790" y="190" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">Un test</text>
  <text x="790" y="210" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">por estado</text>
  <text x="790" y="234" text-anchor="middle" fill="#94a3b8" font-size="11">controlando la</text>
  <text x="790" y="250" text-anchor="middle" fill="#94a3b8" font-size="11">respuesta con vi.mock</text>
</svg>
