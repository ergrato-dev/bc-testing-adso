<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Recorrido de un test E2E</text>

  <!-- Playwright -->
  <rect x="25" y="120" width="140" height="90" rx="8" fill="#1e293b" stroke="#2EAD33" stroke-width="2"/>
  <text x="95" y="155" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Playwright</text>
  <text x="95" y="178" text-anchor="middle" fill="#94a3b8" font-size="12">tu test</text>
  <text x="95" y="196" text-anchor="middle" fill="#94a3b8" font-size="11">fill · click · expect</text>

  <!-- Navegador -->
  <rect x="200" y="120" width="140" height="90" rx="8" fill="#1e293b"/>
  <text x="270" y="155" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Navegador</text>
  <text x="270" y="178" text-anchor="middle" fill="#94a3b8" font-size="12">Chromium real</text>

  <!-- React -->
  <rect x="375" y="120" width="140" height="90" rx="8" fill="#1e293b" stroke="#61DAFB" stroke-width="2"/>
  <text x="445" y="155" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">React</text>
  <text x="445" y="178" text-anchor="middle" fill="#94a3b8" font-size="12">tu frontend</text>

  <!-- API -->
  <rect x="550" y="100" width="150" height="130" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="625" y="130" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">API</text>
  <text x="625" y="158" text-anchor="middle" fill="#94a3b8" font-size="12">FastAPI</text>
  <text x="625" y="178" text-anchor="middle" fill="#94a3b8" font-size="12">Express</text>
  <text x="625" y="198" text-anchor="middle" fill="#94a3b8" font-size="12">Spring Boot</text>

  <!-- BD -->
  <rect x="735" y="120" width="140" height="90" rx="8" fill="#1e293b"/>
  <text x="805" y="155" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Base de datos</text>
  <text x="805" y="178" text-anchor="middle" fill="#94a3b8" font-size="12">PostgreSQL</text>
  <text x="805" y="196" text-anchor="middle" fill="#94a3b8" font-size="12">MySQL</text>

  <line x1="167" y1="165" x2="196" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="342" y1="165" x2="371" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="517" y1="165" x2="546" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="702" y1="165" x2="731" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Frontera de lo que ve el test -->
  <rect x="190" y="80" width="160" height="170" rx="10" fill="none" stroke="#2EAD33" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="270" y="72" text-anchor="middle" fill="#86efac" font-size="12">Lo único que ve el test</text>

  <text x="450" y="290" text-anchor="middle" fill="#f1f5f9" font-size="14">El test habla solo con el navegador: el resto de la app funciona como en producción.</text>
  <text x="450" y="318" text-anchor="middle" fill="#94a3b8" font-size="13">Por eso el mismo test sirve igual con FastAPI, Express o Spring Boot.</text>
  <text x="450" y="346" text-anchor="middle" fill="#94a3b8" font-size="13">Y por eso es lento: cada test recorre todas las capas.</text>
</svg>
