  <text x="140" y="356" text-anchor="middle" fill="#f1f5f9" font-size="13">Base de datos</text>
  <rect x="300" y="336" width="170" height="32" rx="5" fill="#334155"/><text x="385" y="357" text-anchor="middle" fill="#94a3b8" font-size="12">no se usa</text>
  <rect x="495" y="336" width="170" height="32" rx="5" fill="#334155"/><text x="580" y="357" text-anchor="middle" fill="#94a3b8" font-size="12">no se usa</text>
  <rect x="690" y="336" width="170" height="32" rx="5" fill="#334155"/><text x="775" y="357" text-anchor="middle" fill="#94a3b8" font-size="12">no se usa</text>

  <!-- Leyenda -->
  <rect x="250" y="388" width="14" height="14" fill="#14532d"/><text x="270" y="400" fill="#94a3b8" font-size="12">código real</text>
  <rect x="380" y="388" width="14" height="14" fill="#854d0e"/><text x="400" y="400" fill="#94a3b8" font-size="12">doble de prueba</text>
  <rect x="530" y="388" width="14" height="14" fill="#334155"/><text x="550" y="400" fill="#94a3b8" font-size="12">no interviene (semana 6)</text>
