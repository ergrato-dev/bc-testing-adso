  <text x="140" y="308" text-anchor="middle" fill="#f1f5f9" font-size="13">Repositorio</text>
  <rect x="300" y="288" width="170" height="32" rx="5" fill="#854d0e"/><text x="385" y="309" text-anchor="middle" fill="#fde68a" font-size="12">falso (overrides)</text>
  <rect x="495" y="288" width="170" height="32" rx="5" fill="#854d0e"/><text x="580" y="309" text-anchor="middle" fill="#fde68a" font-size="12">falso (createApp)</text>
  <rect x="690" y="288" width="170" height="32" rx="5" fill="#334155"/><text x="775" y="309" text-anchor="middle" fill="#94a3b8" font-size="12">no se crea</text>

