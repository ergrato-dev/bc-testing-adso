  <text x="580" y="76" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">Express</text>
  <text x="775" y="76" text-anchor="middle" fill="#6DB33F" font-size="13" font-weight="700">Spring Boot</text>

  <!-- Fila: cliente -->
  <text x="140" y="116" text-anchor="middle" fill="#f1f5f9" font-size="13">Cliente de prueba</text>
  <rect x="300" y="96" width="170" height="32" rx="5" fill="#312e81"/><text x="385" y="117" text-anchor="middle" fill="#f1f5f9" font-size="12">TestClient</text>
  <rect x="495" y="96" width="170" height="32" rx="5" fill="#312e81"/><text x="580" y="117" text-anchor="middle" fill="#f1f5f9" font-size="12">supertest</text>
  <rect x="690" y="96" width="170" height="32" rx="5" fill="#312e81"/><text x="775" y="117" text-anchor="middle" fill="#f1f5f9" font-size="12">MockMvc</text>

  <!-- Fila: rutas y validación -->
  <text x="140" y="164" text-anchor="middle" fill="#f1f5f9" font-size="13">Rutas + JSON + validación</text>
  <rect x="300" y="144" width="170" height="32" rx="5" fill="#14532d"/><text x="385" y="165" text-anchor="middle" fill="#bbf7d0" font-size="12">real</text>
  <rect x="495" y="144" width="170" height="32" rx="5" fill="#14532d"/><text x="580" y="165" text-anchor="middle" fill="#bbf7d0" font-size="12">real</text>
  <rect x="690" y="144" width="170" height="32" rx="5" fill="#14532d"/><text x="775" y="165" text-anchor="middle" fill="#bbf7d0" font-size="12">real</text>

  <!-- Fila: manejo de errores -->
  <text x="140" y="212" text-anchor="middle" fill="#f1f5f9" font-size="13">Errores → código HTTP</text>
  <rect x="300" y="192" width="170" height="32" rx="5" fill="#14532d"/><text x="385" y="213" text-anchor="middle" fill="#bbf7d0" font-size="12">real</text>
  <rect x="495" y="192" width="170" height="32" rx="5" fill="#14532d"/><text x="580" y="213" text-anchor="middle" fill="#bbf7d0" font-size="12">real</text>
  <rect x="690" y="192" width="170" height="32" rx="5" fill="#14532d"/><text x="775" y="213" text-anchor="middle" fill="#bbf7d0" font-size="12">real</text>

  <!-- Fila: servicio -->
  <text x="140" y="260" text-anchor="middle" fill="#f1f5f9" font-size="13">Servicio (reglas)</text>
  <rect x="300" y="240" width="170" height="32" rx="5" fill="#14532d"/><text x="385" y="261" text-anchor="middle" fill="#bbf7d0" font-size="12">real</text>
  <rect x="495" y="240" width="170" height="32" rx="5" fill="#14532d"/><text x="580" y="261" text-anchor="middle" fill="#bbf7d0" font-size="12">real</text>
  <rect x="690" y="240" width="170" height="32" rx="5" fill="#854d0e"/><text x="775" y="261" text-anchor="middle" fill="#fde68a" font-size="12">@MockitoBean</text>

