  <line x1="310" y1="247" x2="310" y2="286" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="322" y="272" fill="#fca5a5" font-size="12">no</text>
  <line x1="560" y1="247" x2="560" y2="286" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="572" y="272" fill="#fca5a5" font-size="12">no</text>

