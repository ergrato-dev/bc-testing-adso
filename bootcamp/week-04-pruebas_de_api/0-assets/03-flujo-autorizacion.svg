  <line x1="402" y1="185" x2="466" y2="185" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="434" y="176" text-anchor="middle" fill="#86efac" font-size="12">sí</text>
  <line x1="652" y1="185" x2="716" y2="185" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/>
