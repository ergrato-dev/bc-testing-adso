<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Mutación manual: ¿mis tests detectan este defecto?</text>

  <!-- 1 -->
  <rect x="40" y="90" width="190" height="80" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="135" y="120" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">1. Muta el código</text>
  <text x="135" y="146" text-anchor="middle" fill="#94a3b8" font-size="12">&gt; por &gt;=, borra un trim(),</text>
  <text x="135" y="162" text-anchor="middle" fill="#94a3b8" font-size="12">invierte una condición</text>

  <!-- 2 -->
  <rect x="290" y="90" width="190" height="80" rx="8" fill="#1e293b"/>
  <text x="385" y="125" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">2. Corre los tests</text>
  <text x="385" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">toda la suite</text>

  <!-- decision -->
  <polygon points="620,80 720,130 620,180 520,130" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="620" y="126" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">¿Algún test</text>
  <text x="620" y="144" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">falla?</text>

  <line x1="232" y1="130" x2="286" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="482" y1="130" x2="516" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Sí -->
  <line x1="720" y1="130" x2="760" y2="130" stroke="#22c55e" stroke-width="2"/>
  <line x1="760" y1="130" x2="760" y2="226" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="772" y="175" fill="#86efac" font-size="13" font-weight="700">Sí</text>
  <rect x="660" y="230" width="210" height="90" rx="8" fill="#14532d"/>
  <text x="765" y="260" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Mutante eliminado ✓</text>
  <text x="765" y="284" text-anchor="middle" fill="#bbf7d0" font-size="12">Tus tests protegen esa regla.</text>
  <text x="765" y="302" text-anchor="middle" fill="#bbf7d0" font-size="12">Deshaz la mutación.</text>

  <!-- No -->
  <line x1="620" y1="180" x2="620" y2="226" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="632" y="208" fill="#fca5a5" font-size="13" font-weight="700">No</text>
  <rect x="380" y="230" width="250" height="90" rx="8" fill="#7f1d1d"/>
  <text x="505" y="260" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Mutante sobrevive ✗</text>
  <text x="505" y="284" text-anchor="middle" fill="#fecaca" font-size="12">Falta un caso. Escribe el test</text>
  <text x="505" y="302" text-anchor="middle" fill="#fecaca" font-size="12">que falla con la mutación.</text>

  <line x1="380" y1="275" x2="385" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 380 275 L 135 275 L 135 174" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="258" y="266" text-anchor="middle" fill="#94a3b8" font-size="12">y vuelve a probar</text>

  <text x="450" y="370" text-anchor="middle" fill="#94a3b8" font-size="12">La cobertura dice qué se ejecutó. La mutación dice qué se verificó.</text>
</svg>
