<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="900" height="380" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Valores límite: "el año no puede ser futuro" (hoy: 2026)</text>

  <!-- Particiones -->
  <rect x="60" y="80" width="460" height="46" rx="6" fill="#14532d"/>
  <text x="290" y="109" text-anchor="middle" fill="#bbf7d0" font-size="14" font-weight="700">Partición válida: año ≤ 2026</text>
  <rect x="530" y="80" width="310" height="46" rx="6" fill="#7f1d1d"/>
  <text x="685" y="109" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700">Partición inválida: año &gt; 2026</text>

  <!-- Recta -->
  <line x1="60" y1="190" x2="840" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="525" y1="150" x2="525" y2="230" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="525" y="145" text-anchor="middle" fill="#a5b4fc" font-size="12">el borde</text>

  <!-- Puntos -->
  <circle cx="150" cy="190" r="8" fill="#22c55e"/>
  <text x="150" y="222" text-anchor="middle" fill="#f1f5f9" font-size="14">1937</text>
  <text x="150" y="240" text-anchor="middle" fill="#94a3b8" font-size="11">representante</text>

  <circle cx="420" cy="190" r="8" fill="#22c55e"/>
  <text x="420" y="222" text-anchor="middle" fill="#f1f5f9" font-size="14">2025</text>

  <circle cx="525" cy="190" r="11" fill="#22c55e" stroke="#f1f5f9" stroke-width="3"/>
  <text x="525" y="222" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">2026</text>

  <circle cx="630" cy="190" r="8" fill="#ef4444"/>
  <text x="630" y="222" text-anchor="middle" fill="#f1f5f9" font-size="14">2027</text>

  <circle cx="780" cy="190" r="8" fill="#ef4444"/>
  <text x="780" y="222" text-anchor="middle" fill="#f1f5f9" font-size="14">2999</text>
  <text x="780" y="240" text-anchor="middle" fill="#94a3b8" font-size="11">representante</text>

  <!-- Comparación -->
  <rect x="60" y="270" width="380" height="80" rx="8" fill="#1e293b"/>
  <text x="250" y="298" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Código correcto:  year &gt; 2026</text>
  <text x="250" y="326" text-anchor="middle" fill="#bbf7d0" font-size="13">2026 → válido ✓</text>

  <rect x="460" y="270" width="380" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="650" y="298" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Mutante:  year &gt;= 2026</text>
  <text x="650" y="326" text-anchor="middle" fill="#fecaca" font-size="13">2026 → rechazado ✗ (solo lo detecta el borde)</text>
</svg>
