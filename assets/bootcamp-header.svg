<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200"
     font-family="Inter, Roboto, 'Open Sans', system-ui, sans-serif">

  <!-- ═══ BACKGROUND ═══════════════════════════════════════════════════ -->
  <rect width="800" height="200" fill="#0f172a"/>

  <!-- ═══ TOP + BOTTOM ACCENT BARS (indigo) ════════════════════════════ -->
  <rect width="800" height="4" fill="#6366f1"/>
  <rect y="196" width="800" height="4" fill="#6366f1"/>

  <!-- ═══ LEFT PANEL: one color bar per stack layer (8px × 38.4px) ═════ -->
  <rect x="0" y="4"     width="8" height="38.4" fill="#61DAFB"/>
  <rect x="0" y="42.4"  width="8" height="38.4" fill="#009688"/>
  <rect x="0" y="80.8"  width="8" height="38.4" fill="#94a3b8"/>
  <rect x="0" y="119.2" width="8" height="38.4" fill="#6DB33F"/>
  <rect x="0" y="157.6" width="8" height="38.4" fill="#2EAD33"/>

  <!-- Stack labels -->
  <text x="20" y="21"  fill="#61DAFB" font-size="11" font-weight="700" letter-spacing="0.5">React</text>
  <text x="20" y="34"  fill="#475569" font-size="9.5">Vitest + RTL</text>

  <text x="20" y="59"  fill="#26a69a" font-size="11" font-weight="700" letter-spacing="0.5">FastAPI</text>
  <text x="20" y="72"  fill="#475569" font-size="9.5">pytest</text>

  <text x="20" y="98"  fill="#cbd5e1" font-size="11" font-weight="700" letter-spacing="0.5">Express</text>
  <text x="20" y="111" fill="#475569" font-size="9.5">Vitest + supertest</text>

  <text x="20" y="136" fill="#6DB33F" font-size="11" font-weight="700" letter-spacing="0.5">Spring Boot</text>
  <text x="20" y="149" fill="#475569" font-size="9.5">JUnit 5</text>

  <text x="20" y="175" fill="#2EAD33" font-size="11" font-weight="700" letter-spacing="0.5">Playwright</text>
  <text x="20" y="188" fill="#475569" font-size="9.5">E2E</text>

  <!-- Vertical divider -->
  <line x1="120" y1="12" x2="120" y2="188" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ═══ RIGHT PANEL (center x = 460) ════════════════════════════════ -->

  <!-- Main title -->
  <text x="460" y="62" text-anchor="middle"
        fill="#f1f5f9" font-size="27" font-weight="700" letter-spacing="-0.3">
    Bootcamp Testing ADSO
  </text>

  <!-- Tagline -->
  <text x="460" y="93" text-anchor="middle"
        fill="#6366f1" font-size="15" font-weight="700" letter-spacing="3">
    TU PROYECTO FORMATIVO, PROBADO
  </text>

  <!-- Horizontal separator -->
  <line x1="220" y1="105" x2="700" y2="105" stroke="#1e293b" stroke-width="1"/>

  <!-- Topics -->
  <text x="460" y="124" text-anchor="middle"
        fill="#475569" font-size="12">
    Unitarias · Componentes · API · Dobles · Integración con BD · E2E · CI
  </text>

  <!-- ═══ STAT CHIPS (total span 514px, centered at x=460) ════════════ -->

  <!-- Chip 1: 9+1 semanas  x=203 w=110 center=258 -->
  <rect x="203" y="143" width="110" height="26" rx="13" fill="#1e293b"/>
  <rect x="203" y="143" width="110" height="26" rx="13" fill="none" stroke="#4f46e5" stroke-width="1"/>
  <text x="258" y="161" text-anchor="middle"
        fill="#a5b4fc" font-size="11.5" font-weight="600">9+1 semanas</text>

  <!-- Chip 2: 72 horas  x=321 w=96 center=369 -->
  <rect x="321" y="143" width="96" height="26" rx="13" fill="#1e293b"/>
  <rect x="321" y="143" width="96" height="26" rx="13" fill="none" stroke="#4f46e5" stroke-width="1"/>
  <text x="369" y="161" text-anchor="middle"
        fill="#a5b4fc" font-size="11.5" font-weight="600">72 horas</text>

  <!-- Chip 3: SENA · grupos de 3–5  x=425 w=150 center=500 -->
  <rect x="425" y="143" width="150" height="26" rx="13" fill="#1e293b"/>
  <rect x="425" y="143" width="150" height="26" rx="13" fill="none" stroke="#4f46e5" stroke-width="1"/>
  <text x="500" y="161" text-anchor="middle"
        fill="#a5b4fc" font-size="11.5" font-weight="600">SENA · grupos de 3–5</text>

  <!-- Chip 4: cobertura 80%  x=583 w=134 center=650 -->
  <rect x="583" y="143" width="134" height="26" rx="13" fill="#1e293b"/>
  <rect x="583" y="143" width="134" height="26" rx="13" fill="none" stroke="#22c55e" stroke-width="1"/>
  <text x="650" y="161" text-anchor="middle"
        fill="#86efac" font-size="11.5" font-weight="600">Cobertura ≥ 80%</text>
</svg>
