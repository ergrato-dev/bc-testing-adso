# Bases de datos de PRUEBA para las recetas y los tests de integración.
# Usan puertos distintos a los por defecto (5433 y 3307) para no chocar
# con la BD de desarrollo que ya tengas instalada.
#
#   docker compose up -d postgres   # o: docker compose up -d mysql
#   docker compose down -v          # apaga y borra los datos
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: museo
      POSTGRES_PASSWORD: museo
      POSTGRES_DB: museo_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museo -d museo_test"]
      interval: 2s
      retries: 15

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_USER: museo
      MYSQL_PASSWORD: museo
      MYSQL_DATABASE: museo_test
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umuseo", "-pmuseo"]
      interval: 2s
      retries: 30
