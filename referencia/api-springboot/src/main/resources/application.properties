spring.application.name=museo-api
server.port=8000

# Conexión por variables de entorno, por ejemplo:
#   DATABASE_URL=jdbc:postgresql://localhost:5433/museo_test
#   DATABASE_URL=jdbc:mysql://localhost:3307/museo_test
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER:museo}
spring.datasource.password=${DATABASE_PASSWORD:museo}

# Crea o actualiza la tabla al arrancar (suficiente para la app de referencia)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
