[project]
name = "museo-api-fastapi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "sqlalchemy==2.1.0",
    "psycopg[binary]==3.3.6",
    "pymysql==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
]

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
